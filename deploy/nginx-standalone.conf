# 若主機上沒有其他網站，可直接用這份完整的 server 設定：
#   cp deploy/nginx-standalone.conf /etc/nginx/sites-available/mario
#   ln -s /etc/nginx/sites-available/mario /etc/nginx/sites-enabled/mario
#   nginx -t && systemctl reload nginx
# 之後用 certbot --nginx -d 你的網域 取得 HTTPS。

server {
    listen 80;
    listen [::]:80;
    server_name _;   # 換成你的網域或 IP

    location = /mario {
        return 301 /mario/;
    }

    location /mario/ {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
