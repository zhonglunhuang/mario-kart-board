# 放到 /etc/nginx/snippets/mario.conf，然後在既有的 server { } 區塊內加上：
#     include snippets/mario.conf;
# 讓遊戲掛在 http://你的主機/mario/ 底下（WebSocket 反向代理到 Node，port 3100）

location = /mario {
    return 301 /mario/;
}

location /mario/ {
    # 用 IP 開啟時導向 HTTPS 網域（語音功能需要 HTTPS；也避免瀏覽器 HTTPS 優先嘗試逾時）
    if ($host = "187.127.206.177") {
        return 301 https://187-127-206-177.sslip.io$request_uri;
    }
    proxy_pass http://127.0.0.1:3100;
    proxy_http_version 1.1;

    # WebSocket（Socket.IO）必要的標頭
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 長連線不要被 60 秒逾時切斷
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;

    # 壓縮 JS / 3D 模型（.glb），行動網路下載量大約減少 30~70%
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json model/gltf-binary application/octet-stream image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
}
